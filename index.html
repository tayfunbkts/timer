<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08152d">
  <title>Geri Sayım | 6 Kasım 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="countdown" aria-labelledby="page-title">
    <p class="eyebrow">KALAN SÜRE</p>
    <h1 id="page-title">6 Kasım 2026 <span>20:20</span></h1>

    <section class="timer" aria-label="Kalan süre">
      <div class="time-card days">
        <span class="number" id="days">--</span>
        <span class="unit">GÜN</span>
      </div>
      <div class="time-card hours">
        <span class="number" id="hours">--</span>
        <span class="unit">SAAT</span>
      </div>
      <div class="time-card minutes">
        <span class="number" id="minutes">--</span>
        <span class="unit">DAKİKA</span>
      </div>
      <div class="time-card seconds">
        <span class="number" id="seconds">--</span>
        <span class="unit">SANİYE</span>
      </div>
    </section>

    <!-- <p class="status" id="status" role="status">Hedef tarih hesaplanıyor…</p>
    <p class="timezone">Türkiye saati (Europe/Istanbul)</p> -->
  </main>
  <script src="script.js"></script>
</body>
</html>
